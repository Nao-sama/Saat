<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef0f4">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-size:15px}
p{margin:0}
</style>
<title>Dokunmatik Saat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one-screen classroom tool — paper clock on top, digital + English readout and controls beneath */
:root{
  --bg:#eef0f4;
  --surface:#ffffff;
  --fg:#1b1f2a;
  --muted:#5d6577;
  --line:#d6dae3;
  --accent:#2b5fd9;
  --accent-ink:#ffffff;
  --display:"Fredoka","Arial Rounded MT Bold","Helvetica Neue",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171e;--surface:#1e222c;--fg:#eef0f5;--muted:#9aa3b5;--line:#323848;--accent:#7aa2ff;--accent-ink:#0f1320;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171e;--surface:#1e222c;--fg:#eef0f5;--muted:#9aa3b5;--line:#323848;--accent:#7aa2ff;--accent-ink:#0f1320;color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.app{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:14px 20px;max-width:560px;margin:0 auto}

.clock-wrap{width:min(100%,62vh,520px);aspect-ratio:1;max-width:100%}
svg#clock{width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
svg#clock.dragging{cursor:grabbing}
.hand{transition:transform .25s ease}
svg.dragging .hand{transition:none}
@media (prefers-reduced-motion:reduce){.hand{transition:none}}

.readout{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:14px}
.digital{font-family:var(--display);font-weight:600;font-size:2.1rem;font-variant-numeric:tabular-nums;letter-spacing:.02em;min-width:4.6ch}
.words{flex:1;min-width:0;font-size:1.15rem;font-weight:700;line-height:1.3;text-wrap:balance}
.words.hidden-answer{color:var(--muted);font-weight:400;font-style:italic}

.controls{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button{font:inherit;font-weight:700;font-size:.95rem;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  min-height:46px;padding:0 8px;touch-action:manipulation;cursor:pointer}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wide{grid-column:span 2}
.seg{grid-column:span 2;display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;border-radius:0;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.hint{font-size:.85rem;color:var(--muted);text-align:center}
</style>

</head>
<body>
<div class="app">
  <div class="clock-wrap">
    <svg id="clock" viewBox="0 0 400 400" role="img" aria-label="Analog clock">
      <defs>
        <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000" flood-opacity=".28"/>
        </filter>
      </defs>
      <circle cx="200" cy="200" r="194" fill="#ffffff"/>
      <circle cx="200" cy="200" r="184" fill="#ffffff" stroke="#151515" stroke-width="15"/>
      <g id="minuteTicks"></g>
      <g id="hourTicks"></g>
      <g id="numbers" font-family="Fredoka, Arial Rounded MT Bold, Arial, sans-serif" font-weight="600" font-size="44" fill="#151515" text-anchor="middle" dominant-baseline="central"></g>

      <g transform="translate(200 200)">
        <g id="hourHand" class="hand" filter="url(#lift)">
          <path d="M -11 22 Q -15 -35 -6 -98 Q 0 -108 6 -98 Q 15 -35 11 22 Z" fill="#2a2a2a" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round"/>
        </g>
        <g id="minuteHand" class="hand" filter="url(#lift)">
          <path d="M -7 24 L -3.6 -146 Q 0 -158 3.6 -146 L 7 24 Z" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round"/>
        </g>
        <circle r="15" fill="#111" stroke="#fff" stroke-width="3"/>
        <circle r="3.5" fill="#cfcfcf"/>
      </g>
    </svg>
  </div>

  <div class="readout" aria-live="polite">
    <div class="digital" id="digital">2:10</div>
    <div class="words" id="words">It's ten past two.</div>
  </div>

  <div class="controls">
    <button id="minus" aria-label="5 dakika geri">−5 dk</button>
    <button id="plus" aria-label="5 dakika ileri">+5 dk</button>
    <div class="seg" role="group" aria-label="Adım">
      <button id="step1" aria-pressed="false">1 dk</button>
      <button id="step5" aria-pressed="true">5 dk</button>
    </div>
    <button id="random" class="primary wide">Rastgele saat</button>
    <button id="toggle" class="wide">Cevabı gizle</button>
  </div>
  <p class="hint">Akrebi veya yelkovanı parmağınla sürükle. Yelkovan dönerken akrep de ilerler.</p>
</div>

<script>
(function(){
  const NS="http://www.w3.org/2000/svg";
  const svg=document.getElementById('clock');
  const C=200;

  // Face
  const mt=document.getElementById('minuteTicks'), ht=document.getElementById('hourTicks'), nums=document.getElementById('numbers');
  for(let i=0;i<60;i++){
    if(i%5===0) continue;
    const a=i*6*Math.PI/180, r1=171, r2=164;
    const l=document.createElementNS(NS,'line');
    l.setAttribute('x1',C+r1*Math.sin(a)); l.setAttribute('y1',C-r1*Math.cos(a));
    l.setAttribute('x2',C+r2*Math.sin(a)); l.setAttribute('y2',C-r2*Math.cos(a));
    l.setAttribute('stroke','#b9b9b9'); l.setAttribute('stroke-width','2.5'); l.setAttribute('stroke-linecap','round');
    mt.appendChild(l);
  }
  for(let h=1;h<=12;h++){
    const a=h*30*Math.PI/180, r1=178, r2=157;
    const l=document.createElementNS(NS,'line');
    l.setAttribute('x1',C+r1*Math.sin(a)); l.setAttribute('y1',C-r1*Math.cos(a));
    l.setAttribute('x2',C+r2*Math.sin(a)); l.setAttribute('y2',C-r2*Math.cos(a));
    l.setAttribute('stroke','#151515'); l.setAttribute('stroke-width','9'); l.setAttribute('stroke-linecap','round');
    ht.appendChild(l);
    const rn=127, t=document.createElementNS(NS,'text');
    t.setAttribute('x',C+rn*Math.sin(a)); t.setAttribute('y',C-rn*Math.cos(a)+2);
    t.textContent=h; nums.appendChild(t);
  }

  // State: t = minutes since 12:00 (0..719)
  let t=2*60+10, step=5, showWords=true;
  let hourRot=0, minRot=0; // cumulative rotations so CSS transitions take the short way
  const hourEl=document.getElementById('hourHand'), minEl=document.getElementById('minuteHand');
  const digital=document.getElementById('digital'), words=document.getElementById('words');

  const ones=["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
  const hourNames=["twelve","one","two","three","four","five","six","seven","eight","nine","ten","eleven"];
  function num(n){ if(n<20) return ones[n]; const tens=n<30?"twenty":"thirty"; return n%10?tens+"-"+ones[n%10]:tens; }
  function phrase(t){
    const h=Math.floor(t/60)%12, m=t%60, next=(h+1)%12;
    if(m===0) return "It's "+hourNames[h]+" o'clock.";
    if(m===15) return "It's quarter past "+hourNames[h]+".";
    if(m===30) return "It's half past "+hourNames[h]+".";
    if(m===45) return "It's quarter to "+hourNames[next]+".";
    if(m<30){ const unit=m%5?(m===1?" minute":" minutes"):""; return "It's "+num(m)+unit+" past "+hourNames[h]+"."; }
    const r=60-m, unit=r%5?(r===1?" minute":" minutes"):""; return "It's "+num(r)+unit+" to "+hourNames[next]+".";
  }
  function nearest(prev,target){ let d=((target-prev)%360+540)%360-180; return prev+d; }

  function render(){
    hourRot=nearest(hourRot,(t%720)/2);
    minRot=nearest(minRot,(t%60)*6);
    hourEl.style.transform="rotate("+hourRot+"deg)";
    minEl.style.transform="rotate("+minRot+"deg)";
    const h=Math.floor(t/60)%12||12, m=t%60;
    digital.textContent=showWords?h+":"+String(m).padStart(2,"0"):"?:??";
    words.textContent=showWords?phrase(t):"What time is it?";
    words.classList.toggle('hidden-answer',!showWords);
    svg.setAttribute('aria-label','Clock showing '+h+':'+String(m).padStart(2,"0"));
  }

  // Dragging
  let active=null, pid=null;
  function point(e){
    const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY;
    const q=p.matrixTransform(svg.getScreenCTM().inverse());
    const dx=q.x-C, dy=q.y-C;
    let ang=Math.atan2(dx,-dy)*180/Math.PI; if(ang<0) ang+=360;
    return {ang, r:Math.hypot(dx,dy)};
  }
  function angDiff(a,b){ return Math.abs(((a-b)%360+540)%360-180); }

  svg.addEventListener('pointerdown',e=>{
    const {ang,r}=point(e);
    const dm=angDiff(ang,(t%60)*6), dh=angDiff(ang,(t%720)/2);
    if(Math.abs(dm-dh)<18) active = r>105 ? 'min' : 'hour';
    else active = dm<dh ? 'min' : 'hour';
    pid=e.pointerId; svg.setPointerCapture(pid); svg.classList.add('dragging');
    move(e); e.preventDefault();
  });
  function move(e){
    if(!active||e.pointerId!==pid) return;
    const {ang}=point(e);
    if(active==='min'){
      let m=Math.round(ang/6/step)*step%60;
      let d=m-(t%60); if(d>30) d-=60; if(d<-30) d+=60;
      t=((t+d)%720+720)%720;
    }else{
      t=(Math.round(ang*2/step)*step)%720;
    }
    render(); e.preventDefault();
  }
  function end(e){ if(e.pointerId!==pid) return; active=null; pid=null; svg.classList.remove('dragging'); }
  svg.addEventListener('pointermove',move);
  svg.addEventListener('pointerup',end);
  svg.addEventListener('pointercancel',end);
  // iOS: stop page scroll/bounce while touching the clock
  svg.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

  // Controls
  document.getElementById('minus').onclick=()=>{ t=((t-5)%720+720)%720; render(); };
  document.getElementById('plus').onclick=()=>{ t=(t+5)%720; render(); };
  const s1=document.getElementById('step1'), s5=document.getElementById('step5');
  function setStep(n){ step=n; s1.setAttribute('aria-pressed',n===1); s5.setAttribute('aria-pressed',n===5); }
  s1.onclick=()=>setStep(1); s5.onclick=()=>setStep(5);
  const tog=document.getElementById('toggle');
  function setShow(v){ showWords=v; tog.textContent=v?"Cevabı gizle":"Cevabı göster"; render(); }
  tog.onclick=()=>setShow(!showWords);
  document.getElementById('random').onclick=()=>{
    let n; do{ n=Math.floor(Math.random()*144)*5; }while(n===t);
    t=n; setShow(false);
  };

  render();
})();
</script>

</body>
</html>
